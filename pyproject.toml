[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sta-ruh"
version = "0.1.0"
description = "STA-RUH: Structural Theory of Agency—Recurrence Under Handoff benchmark"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = ["pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=8.0"]

[project.scripts]
sta-ruh = "sta_ruh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

